name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Stage FFmpeg for bundling
        run: |
          cp $(which ffmpeg) ./ffmpeg
          cp $(which ffprobe) ./ffprobe
          
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio
          pip install flask waitress pyinstaller

      - name: Pre-download Silero VAD model
        run: |
          python -c "
          import torch, shutil, os
          torch.hub.load('snakers4/silero-vad', 'silero_vad', trust_repo=True)
          hub_dir = torch.hub.get_dir()
          # Find the silero folder (name varies slightly)
          src = next(p for p in os.listdir(hub_dir) if 'silero' in p.lower())
          shutil.copytree(os.path.join(hub_dir, src), 'silero_vad')
          print('Staged:', os.listdir('silero_vad'))
          "

      - name: Build
        run: pyinstaller chaotics_slice.spec --noconfirm

      - name: Zip app bundle
        run: |
          cd dist
          zip -r Slice-macOS-arm64.zip Slice.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/Slice-macOS-arm64.zip

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and stage FFmpeg for bundling
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem -Recurse -Filter "ffmpeg.exe" ffmpeg_tmp | Select-Object -First 1
          Copy-Item $bin.FullName -Destination ffmpeg.exe
          $bin2 = Get-ChildItem -Recurse -Filter "ffprobe.exe" ffmpeg_tmp | Select-Object -First 1
          Copy-Item $bin2.FullName -Destination ffprobe.exe
        shell: pwsh

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install flask waitress pyinstaller

      - name: Pre-download Silero VAD model
        run: |
          python -c "
          import torch, shutil, os
          torch.hub.load('snakers4/silero-vad', 'silero_vad', trust_repo=True)
          hub_dir = torch.hub.get_dir()
          # Find the silero folder (name varies slightly)
          src = next(p for p in os.listdir(hub_dir) if 'silero' in p.lower())
          shutil.copytree(os.path.join(hub_dir, src), 'silero_vad')
          print('Staged:', os.listdir('silero_vad'))
          "

      - name: Pre-download Silero VAD model
        run: |
          python -c "
          import torch, shutil, os
          torch.hub.load('snakers4/silero-vad', 'silero_vad', trust_repo=True)
          hub_dir = torch.hub.get_dir()
          # Find the silero folder (name varies slightly)
          src = next(p for p in os.listdir(hub_dir) if 'silero' in p.lower())
          shutil.copytree(os.path.join(hub_dir, src), 'silero_vad')
          print('Staged:', os.listdir('silero_vad'))
          "

      - name: Build
        run: pyinstaller chaotics_slice.spec --noconfirm

      - name: Zip exe
        run: |
          cd dist
          Compress-Archive -Path Slice.exe -DestinationPath Slice-Windows-x64.zip
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/Slice-Windows-x64.zip

  build-linux:
    name: Ubuntu (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Stage FFmpeg for bundling
        run: |
          cp $(which ffmpeg) ./ffmpeg
          cp $(which ffprobe) ./ffprobe

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install flask waitress pyinstaller

      - name: Build
        run: pyinstaller chaotics_slice.spec --noconfirm

      - name: Tar binary
        run: |
          cd dist
          tar -czf Slice-Linux-x86_64.tar.gz Slice

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/Slice-Linux-x86_64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-macos-arm, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets (debug)
        run: find release-assets -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Chaotics Slice ${{ github.ref_name }}"
          body: |
            ## Chaotics Slice ${{ github.ref_name }}

            AI-powered silence remover — runs 100% locally, no cloud required.

            ### Downloads

            | Platform | File |
            |---|---|
            | macOS Apple Silicon (M1/M2/M3) | `Slice-macOS-arm64.zip` |
            | Windows 10/11 | `Slice-Windows-x64.zip` |
            | Ubuntu / Linux | `Slice-Linux-x86_64.tar.gz` |

            ### First run

            **macOS:** Unzip → right-click the app → Open (required to bypass Gatekeeper on first launch).  
            **Windows:** Unzip → double-click `Slice.exe`. Windows Defender may show a SmartScreen warning — click "More info" → "Run anyway".  
            **Linux:** `tar -xzf Slice-Linux-x86_64.tar.gz && ./Slice`

            > The Silero VAD model (~2 MB) is downloaded on first run and cached locally. Internet required once.

            ### GPU acceleration

            These builds use CPU-only PyTorch for maximum compatibility.  
            For CUDA or MPS acceleration, install from source — see [README](README.md).
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            release-assets/macos-arm64/Slice-macOS-arm64.zip
            release-assets/windows-x64/Slice-Windows-x64.zip
            release-assets/linux-x86_64/Slice-Linux-x86_64.tar.gz